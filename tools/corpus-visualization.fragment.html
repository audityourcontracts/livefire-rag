<div id="livefire-corpus-pca">
  <style>
    #livefire-corpus-pca { color: var(--foreground); font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; width: 100%; }
    #livefire-corpus-pca .viz-title { font-size: 18px; font-weight: 650; margin-bottom: 2px; }
    #livefire-corpus-pca .viz-subtitle { color: color-mix(in srgb, var(--foreground) 68%, transparent); margin-bottom: 9px; }
    #livefire-corpus-pca .viz-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 12px; margin-bottom: 8px; }
    #livefire-corpus-pca .viz-toolbar label { display: inline-flex; align-items: center; gap: 5px; }
    #livefire-corpus-pca select { color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
    #livefire-corpus-pca .viz-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px; }
    #livefire-corpus-pca .viz-legend button { appearance: none; background: transparent; border: 0; color: var(--foreground); padding: 2px 0; cursor: pointer; font: inherit; opacity: 1; }
    #livefire-corpus-pca .viz-legend button[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }
    #livefire-corpus-pca .viz-swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    #livefire-corpus-pca .viz-plot { position: relative; width: 100%; min-height: 470px; }
    #livefire-corpus-pca svg { display: block; width: 100%; min-height: 470px; overflow: visible; }
    #livefire-corpus-pca rect[data-chart-frame] { fill: color-mix(in srgb, var(--background) 40%, transparent); stroke: var(--border); }
    #livefire-corpus-pca .axis path, #livefire-corpus-pca .axis line { stroke: var(--border); }
    #livefire-corpus-pca .axis text, #livefire-corpus-pca .axis-title, #livefire-corpus-pca .anchor-number { fill: var(--foreground); font-size: 12px; }
    #livefire-corpus-pca .point { opacity: .42; }
    #livefire-corpus-pca .point.isolation { opacity: .95; stroke: var(--foreground); stroke-width: 1.4px; }
    #livefire-corpus-pca .point.anchor { opacity: 1; stroke: var(--foreground); stroke-width: 2px; }
    #livefire-corpus-pca .anchor-number { font-size: 11px; font-weight: 750; text-anchor: middle; pointer-events: none; }
    #livefire-corpus-pca .tooltip { position: absolute; z-index: 4; pointer-events: none; display: none; max-width: 285px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 5px; background: var(--popover); color: var(--popover-foreground); box-shadow: 0 3px 14px color-mix(in srgb, var(--foreground) 14%, transparent); }
    #livefire-corpus-pca .tooltip strong { display: block; margin-bottom: 3px; }
    #livefire-corpus-pca .viz-key { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 14px; margin-top: 7px; }
    #livefire-corpus-pca .viz-key div { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #livefire-corpus-pca .viz-num { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-right: 5px; border: 1px solid var(--foreground); border-radius: 50%; font-size: 10px; font-weight: 700; }
    #livefire-corpus-pca .viz-note { margin-top: 7px; color: color-mix(in srgb, var(--foreground) 70%, transparent); font-size: 12px; }
    @media (max-width: 560px) { #livefire-corpus-pca .viz-key { grid-template-columns: 1fr; } #livefire-corpus-pca .viz-plot, #livefire-corpus-pca svg { min-height: 400px; } }
  </style>
  <div class="viz-title">LiveFire RAG corpus — PCA overview</div>
  <div class="viz-subtitle" id="lfpca-subtitle"></div>
  <div class="viz-toolbar">
    <label>Projection <select id="lfpca-axes"><option value="12">PC1 × PC2</option><option value="13">PC1 × PC3</option></select></label>
    <label><input id="lfpca-isolation" type="checkbox" checked> Ring top-1% embedding-isolation candidates</label>
    <label><input id="lfpca-anchors" type="checkbox" checked> Mark investigation examples</label>
  </div>
  <div class="viz-legend" id="lfpca-legend"></div>
  <div class="viz-plot" id="lfpca-plot"><svg role="img" aria-label="PCA scatter plot of the LiveFire RAG embedding corpus"></svg><div class="tooltip" role="tooltip"></div></div>
  <div class="viz-key" id="lfpca-key"></div>
  <div class="viz-note">Rings show sparse neighborhoods in the original 4,096-dimensional cosine space—not maliciousness. PCA is an exploratory display; axis distance is not the retrieval distance.</div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const SOURCE = __CORPUS_DATA__;
      const DATA = {
        meta: SOURCE.m,
        points: SOURCE.p.map(r => ({
          id:r[0], kind:SOURCE.kk[r[1]], kindLabel:SOURCE.kl[r[1]],
          x12:r[2], y12:r[3], x13:r[2], y13:r[4], frequency:r[5],
          isolationPercentile:r[6], lofPercentile:r[7],
          summary:r[8] || SOURCE.kl[r[1]], anchor:Boolean(r[9])
        }))
      };
      const root = document.getElementById('livefire-corpus-pca');
      const svg = d3.select(root.querySelector('svg'));
      const plot = root.querySelector('#lfpca-plot');
      const tooltip = root.querySelector('.tooltip');
      const axesSelect = root.querySelector('#lfpca-axes');
      const isolationToggle = root.querySelector('#lfpca-isolation');
      const anchorToggle = root.querySelector('#lfpca-anchors');
      const kinds = Array.from(new Set(DATA.points.map(d => d.kind)));
      const active = new Set(kinds);
      const series = ['var(--viz-series-1)','var(--viz-series-2)','var(--viz-series-3)','var(--viz-series-4)','var(--viz-series-5)'];
      const colors = new Map(kinds.map((kind, i) => [kind, series[i % series.length]]));
      const anchorPoints = DATA.points.filter(d => d.anchor).sort((a,b) => a.summary.localeCompare(b.summary));
      const anchorNumbers = new Map(anchorPoints.map((d,i) => [d.id, i + 1]));

      root.querySelector('#lfpca-subtitle').textContent = `${DATA.meta.documents.toLocaleString()} semantic documents from ${DATA.meta.sourceObservations.toLocaleString()} observations · PC1–2 explain ${(DATA.meta.explainedVariance.cumulative2 * 100).toFixed(1)}% · hover any point`;
      const legend = root.querySelector('#lfpca-legend');
      kinds.forEach((kind, i) => {
        const sample = DATA.points.find(d => d.kind === kind);
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-pressed', 'true');
        button.innerHTML = `<span class="viz-swatch" style="background:${series[i % series.length]}"></span>${sample.kindLabel}`;
        button.addEventListener('click', () => {
          if (active.has(kind)) active.delete(kind); else active.add(kind);
          button.setAttribute('aria-pressed', String(active.has(kind)));
          draw();
        });
        legend.appendChild(button);
      });
      const key = root.querySelector('#lfpca-key');
      anchorPoints.forEach(d => {
        const item = document.createElement('div');
        item.innerHTML = `<span class="viz-num">${anchorNumbers.get(d.id)}</span>${d.summary}`;
        key.appendChild(item);
      });

      function draw() {
        const width = Math.max(340, plot.clientWidth);
        const height = width < 560 ? 400 : 470;
        const margin = {top: 12, right: 18, bottom: 48, left: 64};
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const mode = axesSelect.value;
        const xField = mode === '12' ? 'x12' : 'x13';
        const yField = mode === '12' ? 'y12' : 'y13';
        const visible = DATA.points.filter(d => active.has(d.kind));
        const xExtent = d3.extent(DATA.points, d => d[xField]);
        const yExtent = d3.extent(DATA.points, d => d[yField]);
        const xPad = (xExtent[1] - xExtent[0]) * .04 || .1;
        const yPad = (yExtent[1] - yExtent[0]) * .04 || .1;
        const x = d3.scaleLinear().domain([xExtent[0]-xPad, xExtent[1]+xPad]).range([0, innerW]);
        const y = d3.scaleLinear().domain([yExtent[0]-yPad, yExtent[1]+yPad]).range([innerH, 0]);
        svg.attr('viewBox', `0 0 ${width} ${height}`);
        svg.selectAll('*').remove();
        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
        g.append('rect').attr('data-chart-frame','').attr('width',innerW).attr('height',innerH);
        g.append('g').attr('class','axis').attr('transform',`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(width < 500 ? 4 : 6));
        g.append('g').attr('class','axis').call(d3.axisLeft(y).ticks(5));
        g.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',innerW/2).attr('y',innerH+39).attr('text-anchor','middle').text('PC1 score');
        g.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform','rotate(-90)').attr('x',-innerH/2).attr('y',-47).attr('text-anchor','middle').text(mode === '12' ? 'PC2 score' : 'PC3 score');
        const dots = g.append('g').selectAll('circle.point').data(visible, d => d.id).join('circle')
          .attr('class', d => `point${isolationToggle.checked && d.isolationPercentile >= 99 ? ' isolation' : ''}${anchorToggle.checked && d.anchor ? ' anchor' : ''}`)
          .attr('cx', d => x(d[xField])).attr('cy', d => y(d[yField]))
          .attr('r', d => anchorToggle.checked && d.anchor ? 6 : isolationToggle.checked && d.isolationPercentile >= 99 ? 4.2 : Math.min(3.2, 1.3 + Math.log1p(d.frequency) * .28))
          .attr('fill', d => colors.get(d.kind));
        dots.on('pointermove', (event,d) => {
          tooltip.style.display = 'block';
          tooltip.innerHTML = `<strong>${d.summary}</strong>${d.kindLabel}<br>Isolation percentile: ${d.isolationPercentile.toFixed(2)}<br>LOF percentile: ${d.lofPercentile.toFixed(2)}<br>Occurrences: ${d.frequency.toLocaleString()}<br>${d.id}`;
          const bounds = root.getBoundingClientRect();
          const left = Math.min(event.clientX - bounds.left + 12, bounds.width - 300);
          tooltip.style.left = `${Math.max(0,left)}px`;
          tooltip.style.top = `${event.clientY - bounds.top + 12}px`;
        }).on('pointerleave', () => { tooltip.style.display = 'none'; });
        if (anchorToggle.checked) {
          g.append('g').selectAll('text').data(visible.filter(d => d.anchor)).join('text')
            .attr('class','anchor-number').attr('x',d => x(d[xField])).attr('y',d => y(d[yField])+3.7).text(d => anchorNumbers.get(d.id));
        }
      }
      axesSelect.addEventListener('change', draw);
      isolationToggle.addEventListener('change', draw);
      anchorToggle.addEventListener('change', draw);
      new ResizeObserver(draw).observe(plot);
      draw();
    })();
  </script>
</div>
