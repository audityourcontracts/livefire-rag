[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "livefire-rag"
version = "0.1.0"
description = "Standalone immutable semantic command index and Livefire SDK provider"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
prototype = ["duckdb>=1.4,<2", "pytz>=2025.2,<2027"]
test = []

[project.scripts]
livefire-rag = "livefire_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livefire_rag"]

[tool.hatch.build.targets.wheel.force-include]
"specs/evidence-common.v1.schema.json" = "livefire_rag/evidence_specs/evidence-common.v1.schema.json"
"specs/evidence-coverage-report.v1.schema.json" = "livefire_rag/evidence_specs/evidence-coverage-report.v1.schema.json"
"specs/evidence-document.v1.schema.json" = "livefire_rag/evidence_specs/evidence-document.v1.schema.json"
"specs/evidence-index-manifest.v1.schema.json" = "livefire_rag/evidence_specs/evidence-index-manifest.v1.schema.json"
"specs/evidence-occurrence-row.v1.schema.json" = "livefire_rag/evidence_specs/evidence-occurrence-row.v1.schema.json"
"specs/evidence-projection-pack.v1.schema.json" = "livefire_rag/evidence_specs/evidence-projection-pack.v1.schema.json"
"specs/evidence-search.input.v1.schema.json" = "livefire_rag/evidence_specs/evidence-search.input.v1.schema.json"
"specs/evidence-search.output.v1.schema.json" = "livefire_rag/evidence_specs/evidence-search.output.v1.schema.json"
"specs/evidence-projection-policy.v1.json" = "livefire_rag/evidence_specs/evidence-projection-policy.v1.json"
"specs/typed-parquet-record-profile.v1.json" = "livefire_rag/evidence_specs/typed-parquet-record-profile.v1.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/fixtures/semantic-index",
  "/specs",
]
