[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "livefire-rag"
version = "0.1.0"
description = "Standalone immutable semantic command index and Livefire SDK provider"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
prototype = ["duckdb>=1.4,<2", "pytz>=2025.2,<2027"]
test = []

[project.scripts]
livefire-rag = "livefire_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livefire_rag"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/fixtures/semantic-index",
  "/specs/semantic-result.v1.schema.json",
]
