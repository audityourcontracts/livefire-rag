[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "livefire-rag"
version = "0.1.0"
description = "Standalone immutable semantic command index and Livefire SDK provider"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Rust",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
prototype = ["duckdb>=1.4,<2", "pytz>=2025.2,<2027"]
analysis = ["duckdb>=1.4,<2"]
test = []

[project.scripts]
livefire-rag = "livefire_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livefire_rag", "python/livefire_rag_analysis"]

[tool.hatch.build.targets.wheel.force-include]
